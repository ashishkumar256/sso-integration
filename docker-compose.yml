services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SERVICE_NAME: Flask service
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OKTA_ISSUER: ${OKTA_ISSUER:?Set OKTA_ISSUER in .env}
      OKTA_REDIRECT_URI: ${OKTA_REDIRECT_URI:-}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:?Set OKTA_CLIENT_ID in .env}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET:?Set OKTA_CLIENT_SECRET in .env}
      OKTA_ADMIN_GROUP: ${OKTA_ADMIN_GROUP:-AuthMantra-Admins}
      OKTA_ALLOWED_EMAILS: ${OKTA_ALLOWED_EMAILS:-ashish@authmantra.com,poc@authmantra.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-ashish@authmantra.com}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
      LOCAL_USER_EMAIL: ${LOCAL_USER_EMAIL:-poc@authmantra.com}
      LOCAL_USER_PASSWORD: ${LOCAL_USER_PASSWORD:-}
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "2"
      - --access-logfile
      - "-"
      - --access-logformat
      - '%(h)s %(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s'
      - --error-logfile
      - "-"
      - --capture-output
      - --log-level
      - ${LOG_LEVEL:-debug}
      - app:app
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s