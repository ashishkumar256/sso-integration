services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-authmantra}
      POSTGRES_USER: ${POSTGRES_USER:-authmantra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-authmantra}:${POSTGRES_PASSWORD:-local_dev_only}@postgres:5432/${POSTGRES_DB:-authmantra}
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret-before-deploying}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ashish@authmantra.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
      TEST_USER_EMAIL: ${TEST_USER_EMAIL:-poc@authmantra.com}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-TestPass123!}
      FRONTEND_ORIGIN: http://localhost:3000
      OKTA_ISSUER: ${OKTA_ISSUER:-}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:-}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET:-}
      OKTA_REDIRECT_URI: ${OKTA_REDIRECT_URI:-http://localhost:8000/api/auth/okta/callback}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_ADMIN_EMAIL: ${ADMIN_EMAIL:-ashish@authmantra.com}
        VITE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
        VITE_TEST_USER_EMAIL: ${TEST_USER_EMAIL:-poc@authmantra.com}
        VITE_TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-TestPass123!}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
